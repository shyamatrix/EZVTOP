name: Build Android APK - PomodoroFlow

on:
  push:
    branches:
      - claude/pomodoro-react-native-app-heqptz
    paths:
      - 'pomodoro-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pomodoro-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" --sdk_root=$ANDROID_SDK_ROOT || true

      - name: Install dependencies
        working-directory: pomodoro-app
        run: npm install --legacy-peer-deps

      - name: Generate keystore for signing
        run: |
          keytool -genkeypair \
            -v \
            -keystore pomodoro-app/android-keystore.jks \
            -alias pomodoroflow \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PomodoroFlow, OU=App, O=PomodoroFlow, L=City, S=State, C=US" \
            -storepass pomodoroflow123 \
            -keypass pomodoroflow123

      - name: Run Expo Prebuild
        working-directory: pomodoro-app
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure signing
        working-directory: pomodoro-app/android
        run: |
          cat >> app/build.gradle << 'EOF'

          android.signingConfigs {
              release {
                  storeFile file("../../android-keystore.jks")
                  storePassword "pomodoroflow123"
                  keyAlias "pomodoroflow"
                  keyPassword "pomodoroflow123"
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          EOF

      - name: Make gradlew executable
        working-directory: pomodoro-app/android
        run: chmod +x gradlew

      - name: Build Debug APK (faster, no signing required)
        working-directory: pomodoro-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Rename APK
        run: |
          mkdir -p release-output
          cp pomodoro-app/android/app/build/outputs/apk/debug/app-debug.apk \
             release-output/PomodoroFlow-v1.0.0-debug.apk
          ls -lh release-output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PomodoroFlow-APK
          path: release-output/PomodoroFlow-v1.0.0-debug.apk
          retention-days: 30

      - name: Display APK info
        run: |
          echo "======================================"
          echo "✅ PomodoroFlow APK Build Complete!"
          echo "======================================"
          echo "APK Size: $(du -sh release-output/PomodoroFlow-v1.0.0-debug.apk | cut -f1)"
          echo ""
          echo "To install on Android device:"
          echo "1. Enable 'Unknown Sources' in Settings > Security"
          echo "2. Download the artifact from GitHub Actions"
          echo "3. Install the APK on your device"
          echo "======================================"
